<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Namma Route Buddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

  <header class="header">
    <div class="header-left">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
        <circle cx="10" cy="10" r="9" stroke="#f4f4f4" stroke-width="1.5"/>
        <path d="M4 10h12M10 4l4 6-4 6" stroke="#f4f4f4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="header-product">Namma Route Buddy</span>
    </div>
    <div class="header-right">
      <span class="granite-tag">IBM Granite</span>
      <select class="lang-select" id="langSelect" aria-label="Select language">
        <option value="en-IN">English</option>
        <option value="kn-IN">Kannada</option>
        <option value="hi-IN">Hindi</option>
        <option value="ta-IN">Tamil</option>
      </select>
    </div>
  </header>

  <div class="layout">

    <div class="panel-left">
      <div class="section-label">Plan your journey</div>

      <div class="input-group">
        <div class="input-row">
          <label class="input-label" for="fromInput">From</label>
          <input type="text" id="fromInput" class="carbon-input" placeholder="Station, area or landmark" autocomplete="off">
          <div class="autocomplete-list" id="fromList" role="listbox"></div>
          <div class="resolved-name" id="fromResolved"></div>
        </div>

        <div class="swap-row">
          <button class="icon-btn" id="swapBtn" title="Swap" aria-label="Swap origin and destination">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
              <path d="M11 2v10M11 12l-3-3M11 12l3-3M5 14V4M5 4L2 7M5 4l3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>

        <div class="input-row">
          <label class="input-label" for="toInput">To</label>
          <input type="text" id="toInput" class="carbon-input" placeholder="Station, area or landmark" autocomplete="off">
          <div class="autocomplete-list" id="toList" role="listbox"></div>
          <div class="resolved-name" id="toResolved"></div>
        </div>
      </div>

      <div class="action-row">
        <button class="btn-primary" id="searchBtn">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <circle cx="6.5" cy="6.5" r="5" stroke="currentColor" stroke-width="1.5"/>
            <path d="M10 10l4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          Find Route
        </button>
        <button class="mic-btn" id="micBtn" title="Speak your question" aria-label="Microphone">
          <span class="mic-icon">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
              <rect x="6" y="1" width="6" height="9" rx="3" stroke="currentColor" stroke-width="1.5"/>
              <path d="M3 9a6 6 0 0012 0" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              <path d="M9 15v2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </span>
          <span class="mic-dot"></span>
          <span class="mic-btn-label">Stop</span>
        </button>
      </div>

      <div class="mic-status" id="micStatus" aria-live="polite"></div>

      <div class="question-wrap">
        <input type="text" id="questionInput" class="question-input" placeholder="Or ask a question...">
        <button class="btn-ghost" id="questionBtn">Ask</button>
      </div>
    </div>

    <div class="panel-right">

      <div class="empty-state" id="emptyState">
        <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
          <circle cx="24" cy="24" r="22" stroke="#8d8d8d" stroke-width="1.5"/>
          <path d="M12 24h24M24 12l8 12-8 12" stroke="#8d8d8d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div class="empty-title">Enter a journey</div>
        <div class="empty-desc">Select a start and end point, or speak your question using the microphone.</div>
      </div>

      <div class="loading-state" id="loadingState">
        <div class="spinner"></div>
        <div class="loading-label">Computing route...</div>
      </div>

      <div class="result-panel" id="resultPanel">
        <div id="fallbackNote" class="fallback-note" style="display:none"></div>
        <div id="disambigCard" class="disambig-card" style="display:none"></div>
        <div class="options-row" id="optionsRow"></div>
        <div class="reply-box" id="replyBox">
          <button class="listen-btn" id="listenBtn">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
              <path d="M2 2l8 4-8 4V2z" fill="currentColor"/>
            </svg>
            Speak again
          </button>
          <div id="replyText"></div>
        </div>
        <div class="tip-box" id="tipBox" style="display:none">
          <div class="tip-label">Newcomer Tip</div>
          <div id="tipText"></div>
        </div>
        <div class="timeline" id="timeline"></div>
        <div class="error-box" id="errorBox" style="display:none"></div>
      </div>

    </div>
  </div>

  <footer class="app-footer">
    Routes by <a href="https://maps.google.com" target="_blank" rel="noopener">Google Maps</a>
  </footer>

  <script type="module" src="/js/app.js"></script>

</body>
</html>
